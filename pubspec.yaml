name: safe_ride
description: "SafeRide — a bilingual (Arabic/English) personal travel-safety app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Only what the code uses — add a package in the same change as its first
# import, with its reason in CLAUDE.md §6.
dependencies:
  cloud_firestore: 7.1.0
  cloud_functions: ^7.0.1
  easy_localization: ^3.0.8
  equatable: ^2.1.0
  firebase_auth: 7.0.1
  firebase_core: 5.1.0
  firebase_messaging: 17.0.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.3.3
  flutter_map: ^8.3.2
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  gap: ^3.0.1
  # A journey's route: permission, fixes, Android's location foreground
  # service and iOS background updates (JourneyTracker).
  geolocator: ^14.1.2
  get_it: ^9.2.1
  go_router: ^17.3.0
  google_fonts: ^8.2.0
  http: ^1.6.0
  intl: ^0.20.2
  # Read by the generated `*.g.dart` model code.
  json_annotation: ^4.12.0
  # The app's private directory for the route recorded on the phone.
  latlong2: ^0.10.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  # Emergency Information's Call: opens the phone app with the number filled
  # in (`tel:`) — the user places the call. Nothing dials by itself.
  url_launcher: ^6.3.2
  vector_map_tiles: 9.0.0-beta.13
  vector_tile_renderer: 6.1.0

dev_dependencies:
  # Code generation — these share `analyzer`; bump them together.
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.0

  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  fake_cloud_firestore: 4.5.0
  firebase_auth_mocks: 0.16.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  # Every folder is its own entry: `assets/icons/` does not cover subfolders.
  # Declare a folder in the same commit as its first file — an empty declared
  # folder fails the build.
  assets:
    - assets/translations/
    - assets/icons/
    - assets/images/
    - assets/data/
